<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makine Mühendisliği Yayınları</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  html{color-scheme:light}
:root{
    --ink:#1f2933; --muted:#5f6b76; --line:#e3e7eb; --bg:#ffffff; --soft:#f6f8fa;
    --accent:#2980B9; --accent-dark:#1d6391; --title:#a52a2a;
    --c1:#2980B9; --c2:#E39B3B; --c3:#5BA88A; --c4:#8E6CB8; --c5:#D1605E; --c6:#B9C2CA;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 "Roboto",-apple-system,"Segoe UI",Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h2{font:700 17px/1.3 "Times New Roman",Times,serif;color:var(--title);margin:0 0 12px}
  h2+.sub{margin-top:-8px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
  .stat b{display:block;font-size:22px;color:var(--accent-dark);font-variant-numeric:tabular-nums}
  .stat span{font-size:12.5px;color:var(--muted)}
  .tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;
    padding:5px 14px;font-size:13px;cursor:pointer}
  .tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chart-box{position:relative;height:380px}
  .note{font-size:12px;color:var(--muted);margin:6px 0 0}
  section+section{margin-top:28px}
  .pubs{list-style:none;margin:0;padding:0;border-top:2px solid var(--accent)}
  .pub{border-bottom:1px solid var(--line)}
  .pub a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:11px 8px;
    text-decoration:none;color:inherit;transition:background .15s}
  .pub a:hover,.pub a:focus-visible{background:var(--soft);outline:none}
  .pub .t{font-weight:600;font-size:14.5px;line-height:1.4;color:var(--accent-dark)}
  .pub a:hover .t{text-decoration:underline}
  .pub .meta{grid-column:1;font-size:12.5px;color:var(--muted);line-height:1.45}
  .pub .meta i{color:var(--ink)}
  .pub .meta b{color:var(--ink);font-weight:600}
  .pub .side{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-top:2px}
  .badge{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);
    white-space:nowrap;font-variant-numeric:tabular-nums}
  .badge.idx{border-color:var(--accent);color:var(--accent-dark)}
  footer{margin-top:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
  footer a{color:var(--accent-dark)}
  .err{padding:20px;color:var(--muted)}
  @media (max-width:640px){
    .stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:18px}
    .chart-box{height:300px}
    .pub a{grid-template-columns:1fr;padding:10px 4px}
    .pub .side{grid-column:1;grid-row:auto;flex-direction:row;align-items:center;padding-top:0}
  }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="err">Yükleniyor…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(async function(){
  const app = document.getElementById('app');
  // ?view=grafik  -> yalnızca grafik,  ?view=yayinlar -> yalnızca öne çıkan yayınlar
  const view = new URLSearchParams(location.search).get('view') || 'hepsi';

  let d = window.__DATA__;
  if (!d) {
    try { d = await (await fetch('data.json?v=' + Date.now(), {cache:'no-store'})).json(); }
    catch (e) { app.innerHTML = '<p class="err">Veri yüklenemedi.</p>'; return; }
  }

  // Bölüm kadrosu: isimler büyük/küçük harf ve noktalamadan bağımsız karşılaştırılır
  const norm = s => String(s).toLocaleLowerCase('tr').replace(/[^a-zçğıöşüâîû]/g, '');
  const staff = new Set((d.kadro || []).map(norm));
  const isStaff = (a, p) => staff.has(norm(a)) || (p.dept_authors || []).includes(a);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const nowY = new Date(d.updated).getFullYear();
  const labels = d.years.map(y => y === nowY ? y + '*' : String(y));
  const fmt = n => n.toLocaleString('tr-TR');
  const lastFull = d.years.indexOf(nowY - 1);
  const sciE = d.endeks['SCI-E'], sci = d.endeks['SCI / SSCI'];
  const wosLast = lastFull >= 0 ? sciE[lastFull] + sci[lastFull] : 0;
  const upd = new Date(d.updated).toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'});

  let html = '';
  if (view !== 'yayinlar') {
    html += `
    <section>
      <h2>Yıllara Göre Yayınlanan Bilimsel Yayınlar</h2>
      <div class="stats">
        <div class="stat"><b>${fmt(d.totals.yayin)}</b><span>toplam yayın</span></div>
        <div class="stat"><b>${fmt(d.totals.makale)}</b><span>özgün makale (${d.years[0]}–)</span></div>
        <div class="stat"><b>${fmt(wosLast)}</b><span>${nowY-1} SCI / SCI-E makale</span></div>
      </div>
      <div class="tabs" role="group" aria-label="Grafik görünümü">
        <button data-v="tur" aria-pressed="true">Yayın türü</button>
        <button data-v="endeks" aria-pressed="false">Makale endeksi</button>
      </div>
      <div class="chart-box"><canvas id="ch" aria-label="Yıllara göre yayın sayısı grafiği" role="img"></canvas></div>
      <p class="note">* ${nowY} yılı devam etmektedir. Sayılar bölümün mevcut akademik kadrosunun tüm kariyer yayınlarını kapsar.</p>
    </section>`;
  }
  if (view !== 'grafik' && d.featured && d.featured.length) {
    html += `
    <section>
      <h2>En Yeni Makalelerimiz</h2>
      <p class="sub">SCI / SCI-E indeksli dergilerde yayımlanan son ${d.featured.length} makale · bölüm öğretim elemanları kalın yazılmıştır</p>
      <ol class="pubs">` + d.featured.map(p => {
        const authors = p.authors.split(',').map(a => a.trim()).map(a =>
          isStaff(a, p) ? `<b>${esc(a)}</b>` : esc(a)).join(', ');
        // TAMAMI BÜYÜK HARF dergi adlarını okunur hale getir
        const small = new Set(['of','and','in','for','the','on','an','a','und','fur','to','with']);
        const journal = p.journal === p.journal.toUpperCase()
          ? p.journal.toLowerCase().split(' ').map((w,i) => i && small.has(w) ? w
              : w.split('-').map(x => x.length <= 4 && i === 0 && /^[a-z]+$/.test(x) && w.includes('-') ? x.toUpperCase() : x.charAt(0).toUpperCase() + x.slice(1)).join('-')).join(' ')
          : p.journal;
        const idx = p.index === 'SCI Expanded' ? 'SCI-E' : p.index;
        return `<li class="pub"><a href="${esc(p.url)}" target="_blank" rel="noopener">
          <span class="t">${esc(p.title)}</span>
          <span class="meta"><i>${esc(journal)}</i><br>${authors}</span>
          <span class="side"><span class="badge">${esc(p.year)}</span>${idx ? `<span class="badge idx">${esc(idx)}</span>` : ''}</span>
        </a></li>`;
      }).join('') + `</ol>
    </section>`;
  }
  html += `<footer>Kaynak: <a href="${esc(d.source)}" target="_blank" rel="noopener">KBÜ UNIS Akademik Veri Yönetim Sistemi</a> · Son güncelleme: ${upd}</footer>`;
  app.innerHTML = html;

  if (view === 'yayinlar' || !window.Chart) return;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const sets = {
    tur: [
      {label:'Özgün makale', data:d.makale, backgroundColor:css('--c1')},
      {label:'Bildiri', data:d.bildiri, backgroundColor:css('--c2')},
      {label:'Diğer (kitap, bölüm vb.)', data:d.toplam.map((t,i)=>Math.max(0,t-d.makale[i]-d.bildiri[i])), backgroundColor:css('--c6')}
    ],
    endeks: Object.keys(d.endeks).map((k,i)=>({label:k, data:d.endeks[k],
      backgroundColor:css(['--c1','--c4','--c3','--c2','--c5','--c6'][i] || '--c6')}))
  };
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = css('--muted');
  const chart = new Chart(document.getElementById('ch'), {
    type:'bar',
    data:{labels, datasets:sets.tur},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      scales:{
        x:{stacked:true, grid:{display:false}},
        y:{stacked:true, beginAtZero:true, grid:{color:css('--line')}, title:{display:true, text:'Yayın sayısı'}}
      },
      plugins:{
        legend:{position:'bottom', labels:{boxWidth:12, boxHeight:12}},
        tooltip:{callbacks:{footer:items=>'Toplam: '+items.reduce((s,i)=>s+i.parsed.y,0)}}
      },
      datasets:{bar:{borderRadius:2, maxBarThickness:34}}
    }
  });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', x === b));
    chart.data.datasets = sets[b.dataset.v]; chart.update();
  }));
})();
</script>
</body>
</html>
