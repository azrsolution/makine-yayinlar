name: UNIS verisini güncelle

on:
  schedule:
    - cron: "17 2 * * *"   # her gün 05:17 (TR saati) — UTC 02:17
  workflow_dispatch:        # Actions sekmesinden elle çalıştırma

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install requests beautifulsoup4

      - name: UNIS'ten veriyi çek
        run: python scripts/fetch_unis.py

      - name: Değişiklik varsa kaydet
        run: |
          git config user.name  "unis-bot"
          git config user.email "unis-bot@users.noreply.github.com"
          git add docs/data.json
          # yalnızca 'updated' satırı değiştiyse commit atma
          if git diff --cached --numstat docs/data.json | awk '{exit !($1>1)}'; then
            git commit -m "UNIS verisi güncellendi: $(date -u +%F)"
            git push
          else
            echo "Veride değişiklik yok."
            git reset -q
          fi
